model:
  backbone: efficientnet_b0
  num_classes: 36
  dropout: 0.3
training:
  batch_size: 32
  epochs_phase1: 5
  epochs_phase2: 10
  lr_phase1: 0.001
  lr_phase2: 0.0001
  early_stopping_patience: 3
  seed: 42
data:
  image_size: 224
  num_workers: 2
  train_dir: data/train
  val_dir: data/validation
  test_dir: data/test
output:
  checkpoint_path: results/best_model.pth
  results_dir: results/
